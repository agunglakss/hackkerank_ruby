name: Ruby
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.1.2']

    steps:
    - uses: actions/checkout@v4
    - name: Install Ruby
      run: sudo apt-get update && sudo apt-get install -y ruby${{ matrix.ruby-version }}
    - name: Install dependencies
      run: bundle install
    - name: Set up Ruby
      uses: ruby/setup-ruby@55283cc23133118229fd3f97f9336ee23a179fcf # v1.146.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      run: rspec ./spec
